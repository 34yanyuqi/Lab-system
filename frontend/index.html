<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1017" id="theme-color-meta">
  <meta name="description" content="实验室学生科研任务一体化管理平台">
  <title>实验室学生科研任务一体化管理平台</title>
  <style>
    /* 首屏底色，避免加载瞬间白闪 */
    html { background: #0b1017; }
    html[data-theme="light"] { background: #f4f6fa; }
  </style>
  <script>
    // 在 React 挂载前同步主题，避免暗色用户看到一帧浅色界面
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var mode = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        var root = document.documentElement;
        root.setAttribute('data-theme', mode);
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#f4f6fa' : '#0b1017');
      } catch (e) { /* 忽略隐私模式下的 localStorage 异常 */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
